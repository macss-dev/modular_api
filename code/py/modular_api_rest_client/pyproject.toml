[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macss-modular-api-rest-client"
version = "0.7.0"
description = "Official MACSS outbound REST client for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ccisne.dev" }]
keywords = ["macss", "http", "rest", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = [
    # OpenTelemetry API only — never the SDK, an exporter, grpcio or protobuf. Declared
    # directly rather than inherited, because this package does not depend on
    # macss-modular-api (runbook D21). The API is no-op without an SDK.
    "opentelemetry-api>=1.44,<2",
]

[project.optional-dependencies]
dev = [
    # `tests/test_tracing.py` imports `opentelemetry.sdk.trace`: the API alone is no-op, so asserting
    # that spans are emitted needs an SDK. A test dependency, not a runtime one — the published package
    # still declares only the API (ADR-0005 A1/A2). `modular_api_postgres` already declared this; this
    # package did not, which is why its publish job failed with `No module named 'opentelemetry.sdk'`
    # once the workflow started installing what each package declares.
    "opentelemetry-sdk>=1.44,<2",
    # Configured below at `typeCheckingMode = "strict"`. Declared here because a checker the
    # repo configures and never installs is a checker that has never run.
    "pyright>=1.1.400",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/macss-dev/modular_api"
Repository = "https://github.com/macss-dev/modular_api/tree/main/code/py/modular_api_rest_client"
Issues = "https://github.com/macss-dev/modular_api/issues"
Documentation = "https://github.com/macss-dev/modular_api/tree/main/code/py/modular_api_rest_client#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.11"
# `src/` is checked at full strict, because it is what a consumer's own type checker sees: these
# packages ship `py.typed`, so every annotation here becomes part of the public contract.
typeCheckingMode = "strict"

# `tests/` is strict too, minus the family that means "annotate this expression". Test code binds
# only this repo, and most of those diagnostics come from incomplete third-party stubs — annotating
# around them adds noise to a test without making anything more correct. Everything that can indicate
# a real defect stays on.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
# A pytest fixture is called by name through collection, never by a reference the checker can see, so
# `reportUnusedFunction` reports every `autouse` fixture in this tree. That is the tool not modelling
# pytest, not dead code. `reportUnusedImport` and `reportUnusedVariable` stay on — those do find dead
# code, and they did.
reportUnusedFunction = false
reportUnusedClass = false
# Tests legitimately reach into internals to exercise them directly. In `src/` this rule found real
# coupling and it was fixed rather than silenced.
reportPrivateUsage = false
# `example/` is documentation a consumer copies, not a published typed surface — same relaxed family
# as `tests/`, and the same expectation that nothing which can indicate a real defect is silenced.
[[tool.pyright.executionEnvironments]]
root = "example"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportMissingTypeArgument = false