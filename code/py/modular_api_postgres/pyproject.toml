[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macss-modular-api-postgres"
version = "0.7.0"
description = "Official MACSS Postgres integration package for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ccisne.dev" }]
keywords = ["macss", "postgres", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
# OpenTelemetry API only — never the SDK, an exporter, grpcio or protobuf. Declared
# directly rather than inherited, because this package does not depend on
# macss-modular-api (runbook D21). The API is no-op without an SDK, so a consumer who
# never enables tracing pays a resolution entry and nothing else.
#
# This is the first runtime dependency the package has ever had. ADR-0004 keeps it free
# of any *database driver*, which is untouched: an instrumentation API is not a driver,
# and a new test asserts no driver is present.
dependencies = ["opentelemetry-api>=1.44,<2"]

[project.optional-dependencies]
dev = [
    # The SDK is what makes spans observable at all — the API alone is no-op (runbook D22).
    "opentelemetry-sdk>=1.44,<2",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/macss-dev/modular_api"
Repository = "https://github.com/macss-dev/modular_api/tree/main/code/py/modular_api_postgres"
Issues = "https://github.com/macss-dev/modular_api/issues"
Documentation = "https://github.com/macss-dev/modular_api/tree/main/code/py/modular_api_postgres#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"