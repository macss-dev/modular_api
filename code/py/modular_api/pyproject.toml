[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macss-modular-api"
version = "0.7.0"
description = "Use-case-centric toolkit for building modular APIs with Starlette. Define UseCase classes (input → validate → execute → output), connect them to HTTP routes, and expose OpenAPI documentation automatically."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ccisne.dev" }]
keywords = ["api", "usecase", "openapi", "starlette", "modular", "macss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=0.40",
    "pydantic>=2.0",
    # OpenTelemetry API only — never the SDK, an exporter, grpcio or protobuf.
    # The API is no-op without an SDK, so tracing costs nothing until the
    # application configures a TracerProvider. See ADR-0005 (amended) A1/A2, and
    # tests/tracing/test_dependency_boundary.py, which enforces this.
    "opentelemetry-api>=1.44,<2",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.30"]
graphql = ["json5>=0.9.14", "graphql-core>=3.2,<3.3"]
dev = [
    "json5>=0.9.14",
    "graphql-core>=3.2,<3.3",
    # The SDK is what makes spans observable at all — the API alone is no-op (runbook D22).
    # Declared here and never in `dependencies`, which the boundary test enforces.
    "opentelemetry-sdk>=1.44,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/macss-dev/modular_api"
Repository = "https://github.com/macss-dev/modular_api/tree/main/code/py/modular_api"
Issues = "https://github.com/macss-dev/modular_api/issues"
Documentation = "https://github.com/macss-dev/modular_api/tree/main/code/py/modular_api#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
